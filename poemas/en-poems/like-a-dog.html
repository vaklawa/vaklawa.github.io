            <span id="poem" class="default">
                <h1>Like A Dog</h1>
                <p>I'd like to be tied up and sedated,<br>Covered by a clean white sheet<br>Like a sick dog put to sleep;</p>
                <p>Please, let me be injected<br>The sweet cyanide<br>Of angels.</p>
            </span>
